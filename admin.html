<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/js_w8/favicon.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <title>WOWOROOM 後台管理</title>
    <script type="module" crossorigin src="/js_w8/assets/admin-DNt3uX19.js"></script>
    <link rel="modulepreload" crossorigin href="/js_w8/assets/config-DAZ7FPrF.js">
    <link rel="stylesheet" crossorigin href="/js_w8/assets/config-CIxK3Xyi.css">
    <link rel="stylesheet" crossorigin href="/js_w8/assets/admin-D2ymAShu.css">
  </head>
  <body>
    <nav class="topBar">
      <div class="wrap">
        <h1><a href="#" class="logo">WOWOROOM</a></h1>
        <span class="material-icons menuToggle"> menu </span>
        <ul class="topBar-menu">
          <li><a href="#">後台管理</a></li>
          <li><a href="#">管理員登入</a></li>
        </ul>
      </div>
    </nav>
    <section class="wrap plotting-area">
      <div>
        <h2 class="section-title">產品類別營收比重</h2>
        <div id="chart-LV2"></div>
      </div>
      <div>
        <h2 class="section-title">全品項營收比重</h2>
        <div id="chart-LV3"></div>
      </div>
    </section>
    <section class="wrap orderPage-list">
      <a href="#" class="discardAllBtn" id="discardAllBtn">清除全部訂單</a>
      <div class="orderTableWrap">
        <table class="orderPage-table" style="table-layout: fixed">
          <thead>
            <tr>
              <th width="10%">訂單編號</th>
              <th width="12%">聯絡人</th>
              <th width="15%">聯絡地址</th>
              <th width="10%">電子郵件</th>
              <th width="27%">訂單品項</th>
              <th width="10%">訂單日期</th>
              <th width="8%">訂單狀態</th>
              <th width="8%">操作</th>
            </tr>
          </thead>
          <tbody id="order-body"></tbody>
        </table>
      </div>
    </section>
    <div class="modal-overlay" id="success-modal-overlay">
      <div class="modal">
        <h2 class="alt-msg-text"></h2>
      </div>
    </div>
    <!-- C3 D3 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/5.16.0/d3.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/c3/0.7.18/c3.js"></script>
    <!-- axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
      // 預設 JS，請同學不要修改此處
      let menuOpenBtn = document.querySelector(".menuToggle");
      let linkBtn = document.querySelectorAll(".topBar-menu a");
      let menu = document.querySelector(".topBar-menu");
      menuOpenBtn.addEventListener("click", menuToggle);

      linkBtn.forEach((item) => {
        item.addEventListener("click", closeMenu);
      });

      function menuToggle() {
        if (menu.classList.contains("openMenu")) {
          menu.classList.remove("openMenu");
        } else {
          menu.classList.add("openMenu");
        }
      }
      function closeMenu() {
        menu.classList.remove("openMenu");
      }
    </script>
  </body>
</html>
